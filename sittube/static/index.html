<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Tube</title>
</head>
<body>
    <h1>Self-Checkout Camera Stream</h1>
    <img id="videoFrame" src="" alt="Video Frame">

    <button onclick="connect()">Start stream</button>
    <button onclick="disconnect()">Reset stream</button>

    <h2>Send Data</h2>
    <form id="dataForm">
        <input type="text" id="message" name="message" placeholder="Enter your message">
        <button type="button" onclick="sendData()">Send Data</button>
    </form>

    <script>
        const img = document.getElementById('videoFrame');
        let ws;

        function connect() {
            ws = new WebSocket('ws://localhost:8000/video');

            ws.onmessage = function(event) {
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                img.src = URL.createObjectURL(blob);
            };

            ws.onerror = function(err) {
                console.error('Socket encountered error: ', err.message, 'Closing socket');
                ws.close();
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                img.src = '';
            }
        }

        function sendData() {
            const message = document.getElementById('message').value;
            const data = { message: message };

            fetch('/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
            })
            .catch((error) => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
